name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The same run a developer or an agent does, with CI source path settings on.
      - run: dotnet test -p:ContinuousIntegrationBuild=true
